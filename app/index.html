<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>RBTV Plus 18</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe id="webFrame" src="https://www.rbtvplus18.help/id" allowfullscreen></iframe>

    <!-- Script pemetaan tombol remote TV ke tombol Keyboard/Mouse -->
    <script>
        window.addEventListener('keydown', function(e) {
            var iframe = document.getElementById('webFrame');
            // Meneruskan fokus ke dalam iframe saat tombol remote ditekan
            if (iframe && iframe.contentWindow) {
                iframe.focus();
            }
        });
    </script>
</body>
</html>
